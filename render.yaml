services:
  - type: web
    name: askdata
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_MODE
        value: deepseek
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: RETRIEVAL_TOP_K
        value: "8"
      - key: REPAIR_MAX_ATTEMPTS
        value: "3"
